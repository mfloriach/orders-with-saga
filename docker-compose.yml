services:
  app:
    image: ${APP_IMAGE:-paymentgateway:local}
    build: .
    profiles: ["app"]
    environment:
      PORT: 8080
      DB_DSN: postgres://${APP_DB_USER:-app}:${APP_DB_PASSWORD:-app}@app-db:5432/${APP_DB_NAME:-app}?sslmode=disable
      LEDGER_DSN: postgres://${LEDGER_DB_USER:-ledger}:${LEDGER_DB_PASSWORD:-ledger}@ledger-db:5432/${LEDGER_DB_NAME:-ledger}?sslmode=disable
      REDIS_ADDR: redis:6379
    ports: ["${PORT:-8080}:8080"]
    depends_on:
      app-db:
        condition: service_healthy
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app}
      POSTGRES_DB: ${APP_DB_NAME:-app}
    ports: ["${APP_DB_PORT:-5432}:5432"]
    volumes: [app-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-app}"], interval: 5s, retries: 10 }
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LEDGER_DB_USER:-ledger}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
      POSTGRES_DB: ${LEDGER_DB_NAME:-ledger}
    ports: ["${LEDGER_DB_PORT:-5433}:5432"]
    volumes: [ledger-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${LEDGER_DB_USER:-ledger}"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "ping"], interval: 10s, retries: 10 }

volumes:
  app-db-data: {}
  ledger-db-data: {}
  redis-data: {}
  rabbitmq-data: {}
