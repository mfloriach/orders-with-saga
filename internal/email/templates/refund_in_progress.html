<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Refund In Progress</title>
</head>
<body>
  <h1>Refund In Progress</h1>
  <p>Hello <strong>{{.MerchantName}}</strong>,</p>
  <p>A refund has been initiated and is currently being processed.</p>
  <table cellpadding="8" cellspacing="0" border="0">
    <tr>
      <td><strong>Refund ID</strong></td>
      <td>{{.RefundID}}</td>
    </tr>
    <tr>
      <td><strong>Amount</strong></td>
      <td>{{.Amount}}</td>
    </tr>
    <tr>
      <td><strong>Reason</strong></td>
      <td>{{.RefundReason}}</td>
    </tr>
  </table>
  <p>You will receive another email once the refund is complete.</p>
</body>
</html>
